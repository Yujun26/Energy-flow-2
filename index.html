<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>多能源流 · 冷塔云烟</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="能源流">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <meta name="theme-color" content="#0a0e17">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#0a0e17; font-family:system-ui,'Segoe UI',sans-serif; touch-action: none; }
    .container { position:relative; width:100vw; height:100vw; max-width:920px; max-height:640px; border-radius:24px; overflow:hidden; box-shadow:0 0 70px rgba(0,160,255,0.4),0 20px 50px rgba(0,0,0,0.8); background:#0d1020; cursor:pointer; }
    canvas { display:block; width:100%; height:100%; }
    .dashboard {
      position:absolute; top:16px; right:18px; display:flex; flex-direction:column; gap:5px; pointer-events:none; z-index:10;
      font-size:clamp(8px, 1.4vw, 11px); letter-spacing:0.4px;
    }
    .card {
      background:rgba(8,12,24,0.85); border:1px solid #2e4a70; border-radius:8px; padding:4px 8px;
      backdrop-filter:blur(10px); display:flex; flex-wrap:wrap; align-items:baseline; gap:4px;
    }
    .label { color:#a0bcd8; }
    .value { font-weight:700; }
    .unit { color:#8899aa; font-size:0.8em; }
    .elec { color:#ffb347; text-shadow:0 0 8px #ff9900; }
    .heat { color:#ff6b6b; text-shadow:0 0 8px #ff4444; }
    .water { color:#5aa9ff; text-shadow:0 0 8px #3399ff; }
    .cost-color { color:#ffd966; }
    .carbon-color { color:#8bc34a; }
    .total-row { border-top:1px solid #2e4a70; margin-top:4px; padding-top:5px; }
    .hint {
      position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
      color:#8899bb; font-size:clamp(9px, 1.5vw, 12px); letter-spacing:1.5px; pointer-events:none;
      text-shadow:0 0 10px #3366aa; animation:softPulse 2.8s infinite; white-space:nowrap;
    }
    @keyframes softPulse { 0%,100%{opacity:0.45;} 50%{opacity:1;} }

    /* 管道开关按钮 */
    .pipe-controls {
      position:absolute; left:12px; top:0; bottom:0; display:flex; flex-direction:column;
      justify-content:space-around; z-index:15; pointer-events:none;
    }
    .pipe-btn {
      width:44px; height:44px; border-radius:50%; background:rgba(20,25,45,0.9);
      border:2px solid #3a5070; color:#e0e8ff; font-size:18px; display:flex;
      align-items:center; justify-content:center; pointer-events:auto;
      transition: all 0.2s; cursor:pointer; backdrop-filter:blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .pipe-btn.active { border-color:#4caf50; box-shadow:0 0 12px rgba(76,175,80,0.6); }
    .pipe-btn.inactive { border-color:#f44336; opacity:0.7; }
    .pipe-btn:active { transform:scale(0.92); }

    @media (orientation: landscape) {
      .container { height:60vh; width:90vw; max-height:600px; max-width:1000px; border-radius:20px; }
      .pipe-btn { width:38px; height:38px; font-size:16px; }
      .dashboard { right:10px; top:10px; gap:3px; }
    }
  </style>
</head>
<body>
<div class="container" id="container">
  <canvas id="energyCanvas"></canvas>
  <div class="pipe-controls" id="pipeControls">
    <button class="pipe-btn active" data-pipe="0">⚡</button>
    <button class="pipe-btn active" data-pipe="1">🔥</button>
    <button class="pipe-btn active" data-pipe="2">💧</button>
  </div>
  <div class="dashboard" id="dashboard"></div>
  <span class="hint" id="hint">上划加速 | 下划减速 | 左侧按钮启停管道</span>
</div>

<script>
(function() {
  const container = document.getElementById('container');
  const canvas = document.getElementById('energyCanvas');
  const ctx = canvas.getContext('2d');
  const dashboardEl = document.getElementById('dashboard');
  const hintEl = document.getElementById('hint');
  const pipeControls = document.getElementById('pipeControls');

  let width, height, time = 0;
  let intensity = 1.0, targetIntensity = 1.0;
  const pipeCount = 3;
  const PIPE_TYPE = ['electric', 'heat', 'water'];
  const PIPE_LABELS = ['⚡ 电能', '🔥 热能', '💧 水流'];
  
  // 每个管道独立开关状态
  let pipeActive = [true, true, true];
  
  let pipeY = [], pipeOuterR = 44, pipeInnerR = 28;
  let particles = [];
  const PARTICLES_PER_PIPE = 45;
  const COINS_PER_PIPE = 18;
  let pulses = [], MAX_PULSES = 25;
  
  // 云烟粒子
  let smokeParticles = [];
  const MAX_SMOKE = 70;
  
  let mouseX = -200, mouseY = -200, targetMouseX = -200, targetMouseY = -200;
  let mousePressed = false;
  
  // 手势相关
  let touchStartY = 0, touchLastY = 0;
  let isTouching = false;

  let data = {
    elecPower:0, heatPower:0, waterFlow:0,
    elecCost:0, heatCost:0, waterCost:0,
    elecCO2:0, heatCO2:0, waterCO2:0
  };

  function resize() {
    const rect = container.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2);
    width = rect.width; height = rect.height;
    canvas.width = width * dpr; canvas.height = height * dpr;
    ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr);
    
    pipeY = [];
    const startY = height * 0.22, endY = height * 0.78, step = (endY - startY) / (pipeCount - 1);
    for (let i = 0; i < pipeCount; i++) pipeY.push(startY + i * step);
    pipeOuterR = Math.min(48, height * 0.075);
    pipeInnerR = pipeOuterR * 0.62;
    
    // 更新按钮位置
    const btns = document.querySelectorAll('.pipe-btn');
    btns.forEach((btn, i) => {
      if (pipeY[i] !== undefined) {
        btn.style.position = 'absolute';
        btn.style.top = 'auto';
        btn.style.bottom = 'auto';
        btn.style.left = 'auto';
      }
    });
    initParticles();
  }

  // ----- 粒子类 -----
  class Particle {
    constructor(pipeIdx, type) {
      this.pipeIdx = pipeIdx;
      this.type = type;
      this.energyType = PIPE_TYPE[pipeIdx];
      this.reset(true);
    }
    reset(randomPos = false) {
      const yCenter = pipeY[this.pipeIdx];
      const margin = pipeInnerR * 0.72;
      this.x = randomPos ? Math.random() * width : width + 30 + Math.random() * 80;
      this.y = yCenter + (Math.random() - 0.5) * margin * 2;
      this.size = this.type === 'coin' ? 4.0 + Math.random() * 4.5 : 2.0 + Math.random() * 3.0;
      this.brightness = 0.5 + Math.random() * 0.5;
      this.phase = Math.random() * Math.PI * 2;
      this.trail = []; this.maxTrail = 4 + Math.floor(Math.random() * 5);
      if (this.energyType === 'electric') { this.thermalAmp = 0.5+Math.random()*1.8; this.thermalFreq = 0.05+Math.random()*0.08; }
      else if (this.energyType === 'heat') { this.thermalAmp = 1.3+Math.random()*3.0; this.thermalFreq = 0.07+Math.random()*0.11; }
      else { this.thermalAmp = 0.3+Math.random()*1.2; this.thermalFreq = 0.04+Math.random()*0.06; }
      this.thermalPhase = Math.random() * Math.PI * 2;
    }
    update(t, strength, coinSpeed) {
      const isActive = pipeActive[this.pipeIdx];
      const yCenter = pipeY[this.pipeIdx];
      const margin = pipeInnerR * 0.72;
      let drift;
      if (this.type === 'coin') drift = coinSpeed;
      else {
        if (this.energyType === 'electric') drift = 1.2 + strength * 3.3;
        else if (this.energyType === 'heat') drift = 0.8 + strength * 2.5;
        else drift = 0.9 + strength * 2.9;
      }
      this.x += isActive ? drift : 0.02;
      const jitterY = Math.sin(t * this.thermalFreq + this.thermalPhase) * this.thermalAmp;
      this.y += jitterY * (isActive ? 1 : 0.3);
      if (this.x > width + 40) { this.x = -40; this.y = yCenter + (Math.random()-0.5)*margin*2; this.trail=[]; }
      else if (this.x < -40) { this.x = width+40; this.y = yCenter + (Math.random()-0.5)*margin*2; this.trail=[]; }
      const top = yCenter - margin, bottom = yCenter + margin;
      if (this.y < top) this.y = top + 0.5;
      if (this.y > bottom) this.y = bottom - 0.5;
      this.brightness = 0.45 + 0.55 * Math.sin(t * 0.07 + this.phase);
      this.trail.push({x:this.x, y:this.y, life:1.0});
      if (this.trail.length > this.maxTrail) this.trail.shift();
      for (let tr of this.trail) tr.life -= 0.12;
      this.trail = this.trail.filter(tr => tr.life > 0);
    }
    drawShape(ctx, x, y, size) {
      const s = size * (this.type === 'coin' ? 3.0 : 2.4);
      ctx.save(); ctx.translate(x, y); ctx.scale(s/24, s/24);
      if (this.type === 'coin') {
        ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.strokeStyle='#b8860b'; ctx.lineWidth=3; ctx.setLineDash([3,2]); ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(0,0,8.5,0,Math.PI*2); ctx.fillStyle='#ffd700'; ctx.fill(); ctx.strokeStyle='#b8860b'; ctx.lineWidth=1.2; ctx.stroke();
        ctx.fillStyle='#8b4513'; ctx.font='bold 10px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('¥',0,0);
      } else {
        if (this.energyType === 'electric') {
          ctx.beginPath(); ctx.moveTo(0,-10); ctx.lineTo(6,-3); ctx.lineTo(3,-1); ctx.lineTo(9,9); ctx.lineTo(3,4); ctx.lineTo(7,10); ctx.lineTo(-4,2); ctx.lineTo(0,1); ctx.lineTo(-7,-8); ctx.closePath();
        } else if (this.energyType === 'heat') {
          ctx.beginPath(); ctx.moveTo(0,-10); ctx.quadraticCurveTo(8,-6,8,3); ctx.quadraticCurveTo(9,9,4,10); ctx.quadraticCurveTo(-2,12,-6,6); ctx.quadraticCurveTo(-10,1,-4,-6); ctx.quadraticCurveTo(-2,-9,0,-10); ctx.closePath();
        } else {
          ctx.beginPath(); ctx.moveTo(0,-10); ctx.bezierCurveTo(6,-5,6,7,0,10); ctx.bezierCurveTo(-6,7,-6,-5,0,-10); ctx.closePath();
        }
        ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }
    draw(ctx) {
      let c1, c2;
      if (this.type === 'coin') { c1='255,215,0'; c2='184,134,11'; }
      else { if(this.energyType==='electric'){c1='255,220,100';c2='255,150,30';} else if(this.energyType==='heat'){c1='255,140,60';c2='200,40,10';} else {c1='120,200,255';c2='30,90,200';} }
      if (this.trail.length > 1) {
        ctx.save();
        for (let i=1;i<this.trail.length;i++) {
          const a=this.trail[i], b=this.trail[i-1]; const alpha=a.life*0.5*this.brightness; if(alpha<0.02)continue;
          ctx.strokeStyle=`rgba(${c1},${alpha})`; ctx.lineWidth=this.size*a.life*0.55;
          ctx.shadowColor=`rgba(${c2},${alpha*0.6})`; ctx.shadowBlur=this.size*1.6;
          ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(a.x,a.y); ctx.stroke();
        } ctx.shadowBlur=0; ctx.restore();
      }
      const alpha=0.7+this.brightness*0.3; ctx.save(); ctx.globalAlpha=alpha;
      ctx.shadowColor=`rgba(${c1},${alpha})`; ctx.shadowBlur=this.size*2.5;
      ctx.fillStyle=`rgba(${c1},${alpha})`; ctx.strokeStyle=`rgba(${c2},0.9)`; ctx.lineWidth=0.9;
      this.drawShape(ctx, this.x, this.y, this.size);
      ctx.shadowBlur=0; ctx.restore();
    }
  }

  // ----- 冷却塔云烟粒子 -----
  class SmokeParticle {
    constructor(pipeIdx, towerX, towerTopY) {
      this.pipeIdx = pipeIdx;
      this.towerX = towerX;
      this.towerTopY = towerTopY;
      this.reset(true);
    }
    reset(init = false) {
      this.x = this.towerX + (Math.random() - 0.5) * 25;
      this.y = init ? this.towerTopY + Math.random() * 20 : this.towerTopY + Math.random() * 10;
      this.size = 6 + Math.random() * 16;
      this.speed = 0.4 + Math.random() * 0.8;
      this.wobble = Math.random() * Math.PI * 2;
      this.life = 0.7 + Math.random() * 0.9;
      this.opacity = 0.3 + Math.random() * 0.4;
    }
    update(t, emissionRate) {
      this.y -= this.speed * (0.6 + emissionRate * 1.5);
      this.x += Math.sin(t * 0.8 + this.wobble) * 0.8;
      this.life -= 0.004;
      if (this.y < this.towerTopY - 70 || this.life <= 0) {
        this.reset();
      }
    }
    draw(ctx) {
      const alpha = this.opacity * this.life;
      ctx.save(); ctx.globalAlpha = alpha;
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
      grad.addColorStop(0, 'rgba(255,255,255,0.9)');
      grad.addColorStop(0.7, 'rgba(230,230,230,0.4)');
      grad.addColorStop(1, 'rgba(210,210,210,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  // 冷却塔绘制函数
  function drawCoolingTower(ctx, x, baseY, scale = 1) {
    const h = 55 * scale;
    const baseR = 22 * scale;
    const neckR = 12 * scale;
    const topR = 16 * scale;
    const neckY = baseY - h * 0.55;
    const topY = baseY - h;
    
    ctx.save();
    ctx.translate(x, baseY);
    
    // 主体 (双曲面轮廓)
    ctx.beginPath();
    ctx.moveTo(-baseR, 0);
    ctx.quadraticCurveTo(-baseR*0.9, -h*0.25, -neckR, neckY);
    ctx.quadraticCurveTo(-neckR*0.9, -h*0.75, -topR, topY);
    ctx.lineTo(topR, topY);
    ctx.quadraticCurveTo(neckR*0.9, -h*0.75, neckR, neckY);
    ctx.quadraticCurveTo(baseR*0.9, -h*0.25, baseR, 0);
    ctx.closePath();
    
    const towerGrad = ctx.createLinearGradient(0, topY, 0, 0);
    towerGrad.addColorStop(0, '#7a8b9e');
    towerGrad.addColorStop(0.4, '#a0b0c0');
    towerGrad.addColorStop(0.6, '#6b7a8d');
    towerGrad.addColorStop(1, '#4a5568');
    ctx.fillStyle = towerGrad;
    ctx.fill();
    ctx.strokeStyle = '#2d3748';
    ctx.lineWidth = 1.2 * scale;
    ctx.stroke();
    
    // 底部阴影
    ctx.beginPath();
    ctx.ellipse(0, 0, baseR*1.05, 3, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fill();
    
    // 顶部开口
    ctx.beginPath();
    ctx.ellipse(0, topY, topR*1.1, 2, 0, 0, Math.PI*2);
    ctx.fillStyle = '#1a202c';
    ctx.fill();
    
    ctx.restore();
    return { x: x, topY: topY + baseY };
  }

  let towers = [];
  function updateTowers() {
    towers = [];
    for (let i = 0; i < pipeCount; i++) {
      const x = width * 0.12 + i * 25;
      const baseY = pipeY[i] - pipeOuterR - 15;
      const tower = drawCoolingTower(ctx, x, baseY, 0.85);
      towers.push({ pipeIdx: i, x: tower.x, topY: tower.topY, baseY: baseY });
    }
  }

  function initParticles() {
    particles = [];
    for (let p = 0; p < pipeCount; p++) {
      for (let i = 0; i < PARTICLES_PER_PIPE; i++) particles.push(new Particle(p, 'energy'));
      for (let i = 0; i < COINS_PER_PIPE; i++) particles.push(new Particle(p, 'coin'));
    }
    smokeParticles = [];
    if (towers.length === 0) updateTowers();
    for (let i = 0; i < MAX_SMOKE; i++) {
      const idx = i % pipeCount;
      if (towers[idx]) smokeParticles.push(new SmokeParticle(idx, towers[idx].x, towers[idx].topY));
    }
  }

  // ----- 脉冲 -----
  class Pulse {
    constructor(x,y,type,strength=1){ this.x=x;this.y=y;this.type=type; this.radius=4;this.maxR=22+Math.random()*40*strength; this.speed=3+Math.random()*5;this.life=1.0;this.decay=0.02+Math.random()*0.035; }
    update(){ this.radius+=this.speed; this.life-=this.decay; if(this.life<0)this.life=0; }
    draw(ctx){
      if(this.life<=0||this.radius>this.maxR)return; const alpha=this.life*0.6; let color;
      if(this.type==='electric')color='100,180,255'; else if(this.type==='heat')color='255,120,80'; else color='80,180,255';
      ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=`rgba(${color},${alpha})`; ctx.lineWidth=1.4*this.life;
      ctx.shadowColor=`rgba(${color},${alpha*0.8})`; ctx.shadowBlur=7;
      ctx.beginPath(); ctx.arc(this.x,this.y,this.radius,0,Math.PI*2); ctx.stroke(); ctx.restore();
    }
    isAlive(){return this.life>0.01&&this.radius<this.maxR;}
  }

  function drawBackground(ctx) {
    const grad=ctx.createLinearGradient(0,0,0,height); grad.addColorStop(0,'#070b17'); grad.addColorStop(0.5,'#0c1125'); grad.addColorStop(1,'#070b17');
    ctx.fillStyle=grad; ctx.fillRect(0,0,width,height);
    ctx.save(); ctx.globalAlpha=0.04; ctx.strokeStyle='#4a6490'; ctx.lineWidth=0.4;
    for(let x=0;x<width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,height);ctx.stroke();}
    for(let y=0;y<height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(width,y);ctx.stroke();}
    ctx.restore();
  }

  function drawPipe(ctx, centerY, outerR, innerR, pipeIdx) {
    const type = PIPE_TYPE[pipeIdx];
    const outTop=centerY-outerR, outBottom=centerY+outerR;
    ctx.save();
    ctx.beginPath(); ctx.moveTo(0,outTop+12); ctx.lineTo(width,outTop+12); ctx.arcTo(width+12,outTop+12,width+12,outTop,12); ctx.lineTo(width+12,outBottom-12); ctx.arcTo(width+12,outBottom,width,outBottom,12); ctx.lineTo(0,outBottom); ctx.arcTo(-12,outBottom,-12,outBottom-12,12); ctx.lineTo(-12,outTop+12); ctx.arcTo(-12,outTop,0,outTop,12); ctx.closePath();
    const outerGrad=ctx.createLinearGradient(0,outTop,0,outBottom); outerGrad.addColorStop(0,'#4e525b'); outerGrad.addColorStop(0.5,'#272b32'); outerGrad.addColorStop(1,'#4e525b');
    ctx.fillStyle=outerGrad; ctx.fill(); ctx.restore();

    const inTop=centerY-innerR, inBottom=centerY+innerR;
    ctx.save();
    ctx.beginPath(); ctx.moveTo(2,inTop+8); ctx.lineTo(width-2,inTop+8); ctx.arcTo(width+8,inTop+8,width+8,inTop,8); ctx.lineTo(width+8,inBottom-8); ctx.arcTo(width+8,inBottom,width-2,inBottom,8); ctx.lineTo(2,inBottom); ctx.arcTo(-8,inBottom,-8,inBottom-8,8); ctx.lineTo(-8,inTop+8); ctx.arcTo(-8,inTop,2,inTop,8); ctx.closePath();
    let innerGrad;
    if(type==='electric'){ innerGrad=ctx.createLinearGradient(0,inTop,0,inBottom); innerGrad.addColorStop(0,'#f0b870'); innerGrad.addColorStop(0.5,'#b87030'); innerGrad.addColorStop(1,'#f0b870'); }
    else if(type==='heat'){ innerGrad=ctx.createLinearGradient(0,inTop,0,inBottom); innerGrad.addColorStop(0,'#e8855a'); innerGrad.addColorStop(0.5,'#a03020'); innerGrad.addColorStop(1,'#e8855a'); }
    else { innerGrad=ctx.createLinearGradient(0,inTop,0,inBottom); innerGrad.addColorStop(0,'#6da9d0'); innerGrad.addColorStop(0.5,'#1e4e70'); innerGrad.addColorStop(1,'#6da9d0'); }
    ctx.fillStyle=innerGrad; ctx.fill(); ctx.restore();
  }

  function drawLabels(ctx) {
    ctx.save(); ctx.font='bold 13px "Microsoft YaHei", sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
    for(let i=0;i<pipeCount;i++) {
      const label = PIPE_LABELS[i] + (pipeActive[i] ? '' : ' ⏸');
      ctx.fillStyle = pipeActive[i] ? '#ffffff' : '#888888';
      ctx.shadowColor='#000000'; ctx.shadowBlur=4;
      ctx.fillText(label, width * 0.24, pipeY[i]);
    }
    ctx.restore();
  }

  function updateDashboard() {
    const d = data;
    const totalCO2 = d.elecCO2 + d.heatCO2 + d.waterCO2;
    const totalCost = d.elecCost + d.heatCost + d.waterCost;
    dashboardEl.innerHTML = `
      <div class="card"><span class="label">⚡电能</span><span class="value elec">${d.elecPower.toFixed(1)}</span><span class="unit">kW</span> <span class="value cost-color">¥${d.elecCost.toFixed(2)}</span> <span class="value carbon-color">${d.elecCO2.toFixed(2)}</span></div>
      <div class="card"><span class="label">🔥热能</span><span class="value heat">${d.heatPower.toFixed(1)}</span><span class="unit">kW</span> <span class="value cost-color">¥${d.heatCost.toFixed(2)}</span> <span class="value carbon-color">${d.heatCO2.toFixed(2)}</span></div>
      <div class="card"><span class="label">💧水流</span><span class="value water">${d.waterFlow.toFixed(1)}</span><span class="unit">L/min</span> <span class="value cost-color">¥${d.waterCost.toFixed(2)}</span> <span class="value carbon-color">${d.waterCO2.toFixed(2)}</span></div>
      <div class="card total-row"><span class="label">🌿总CO₂</span><span class="value carbon-color">${totalCO2.toFixed(2)}</span><span class="unit">kg/h</span> <span class="label">💰总费用</span><span class="value cost-color">¥${totalCost.toFixed(2)}</span></div>
    `;
  }

  function animate(ts) {
    time = ts * 0.001;
    ctx.clearRect(0,0,width,height);
    intensity += (targetIntensity - intensity) * 0.1;
    mouseX += (targetMouseX - mouseX) * 0.15;
    mouseY += (targetMouseY - mouseY) * 0.15;

    // 计算各管道功率（若管道关闭则为0）
    data.elecPower = pipeActive[0] ? (8 + intensity*10) : 0;
    data.heatPower = pipeActive[1] ? (5 + intensity*8) : 0;
    data.waterFlow = pipeActive[2] ? (3 + intensity*6) : 0;
    data.elecCost = data.elecPower * 0.75;
    data.heatCost = data.heatPower * 0.55;
    data.waterCost = data.waterFlow * 0.004 * 60;
    data.elecCO2 = data.elecPower * 0.5;
    data.heatCO2 = data.heatPower * 0.25;
    data.waterCO2 = data.waterFlow * 0.001 * 0.2 * 60;

    drawBackground(ctx);
    for (let i=0;i<pipeCount;i++) drawPipe(ctx, pipeY[i], pipeOuterR, pipeInnerR, i);

    // 绘制冷却塔
    updateTowers();
    for (let t of towers) {
      drawCoolingTower(ctx, t.x, t.baseY, 0.85);
    }

    const totalCost = data.elecCost + data.heatCost + data.waterCost;
    const coinSpeed = (totalCost > 0 ? (1.2 + totalCost * 0.25) : 0.2);
    for (let p of particles) {
      p.update(time, intensity, coinSpeed);
      p.draw(ctx);
    }

    // 更新云烟粒子
    const emissionRates = [data.elecCO2/12, data.heatCO2/10, data.waterCO2/4];
    for (let s of smokeParticles) {
      const rate = emissionRates[s.pipeIdx] || 0.1;
      s.update(time, Math.min(2.0, rate));
      s.draw(ctx);
    }

    // 脉冲
    if (pipeActive.some(a => a) && Math.random()<0.03 && pulses.length<MAX_PULSES) {
      const activeIdx = pipeActive.map((a,i) => a ? i : -1).filter(i => i>=0);
      if (activeIdx.length) {
        const idx = activeIdx[Math.floor(Math.random()*activeIdx.length)];
        pulses.push(new Pulse(Math.random()*width, pipeY[idx], PIPE_TYPE[idx], 0.5));
      }
    }
    for (let p of pulses) p.update();
    pulses = pulses.filter(p=>p.isAlive());
    for (let p of pulses) p.draw(ctx);

    drawLabels(ctx);
    updateDashboard();
    requestAnimationFrame(animate);
  }

  // ----- 事件绑定 -----
  function getPos(e){const r=container.getBoundingClientRect(); return{x:e.clientX-r.left, y:e.clientY-r.top};}
  
  // 按钮事件
  document.querySelectorAll('.pipe-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.pipe);
      pipeActive[idx] = !pipeActive[idx];
      btn.classList.toggle('active', pipeActive[idx]);
      btn.classList.toggle('inactive', !pipeActive[idx]);
    });
  });

  // 鼠标/触摸交互
  container.addEventListener('mousedown', e => {
    mousePressed = true;
    const p = getPos(e);
    mouseX = p.x; mouseY = p.y;
    targetMouseX = p.x; targetMouseY = p.y;
  });
  container.addEventListener('mousemove', e => {
    const p = getPos(e);
    targetMouseX = p.x; targetMouseY = p.y;
  });
  container.addEventListener('mouseup', () => { mousePressed = false; });
  container.addEventListener('mouseleave', () => { mousePressed = false; });

  // 触摸手势：上划加速，下划减速
  container.addEventListener('touchstart', e => {
    e.preventDefault();
    isTouching = true;
    const touch = e.touches[0];
    touchStartY = touch.clientY;
    touchLastY = touchStartY;
  }, {passive: false});
  
  container.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!isTouching) return;
    const touch = e.touches[0];
    const deltaY = touch.clientY - touchLastY;
    touchLastY = touch.clientY;
    // 上划 (deltaY < 0) 加速，下划减速
    targetIntensity = Math.max(0.2, Math.min(2.5, targetIntensity - deltaY * 0.02));
  }, {passive: false});
  
  container.addEventListener('touchend', () => { isTouching = false; });
  container.addEventListener('touchcancel', () => { isTouching = false; });

  // 滚轮保留
  container.addEventListener('wheel', e => {
    e.preventDefault();
    targetIntensity = Math.max(0.2, Math.min(2.5, targetIntensity - e.deltaY * 0.005));
  }, {passive: false});

  window.addEventListener('resize', () => {
    clearTimeout(window.resizeTimer);
    window.resizeTimer = setTimeout(() => resize(), 200);
  });
  resize();
  requestAnimationFrame(animate);
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
